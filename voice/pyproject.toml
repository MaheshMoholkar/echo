[project]
name = "echo-voice"
version = "0.1.0"
description = "Echo voice bot: Pipecat with Whisper, Ollama and Kokoro"
requires-python = ">=3.13"
dependencies = [
    "echo-api",
    "mlx-audio>=0.5.7",
    "pipecat-ai[kokoro,mlx-whisper,silero,webrtc,whisper]>=1.12.0",
]

[project.scripts]
echo-voice = "echo_voice:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
echo-api = { path = "../api", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff.lint.isort]
# echo_api is our own package (../api), not a third-party dependency.
known-first-party = ["echo_api", "echo_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
